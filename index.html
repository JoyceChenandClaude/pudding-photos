<style>
:root{--bg:#fdf0e1;--fg:#3f2a1e;--mut:#8b6b57;--card:#fffaf3;--line:#ecd3b8;--acc:#b9714a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1612;--fg:#f4e6d8;--mut:#b49a86;--card:#2b201a;--line:#44342b;--acc:#d99467}}
:root[data-theme="dark"]{--bg:#1f1612;--fg:#f4e6d8;--mut:#b49a86;--card:#2b201a;--line:#44342b;--acc:#d99467}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;text-align:center}
main{max-width:520px;margin:0 auto;padding:22px 14px 40px}
h1{margin:4px 0;font-size:24px;letter-spacing:2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.bub{display:inline-block;max-width:92%;min-height:46px;background:var(--card);border:2px solid var(--fg);border-radius:14px;padding:10px 16px;font-size:15px;line-height:1.6;position:relative}
.bub:after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--fg)}
#bun{display:block;width:230px;height:216px;margin:16px auto 4px;cursor:pointer;shape-rendering:crispEdges}
.pud{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.2s ease-in-out infinite}
.pud.hop{animation:hop .55s ease-out 1}
.ear{transform-box:fill-box;transform-origin:50% 100%}
.pud.hop .ear{animation:wig .55s ease-out 1}
@keyframes bob{50%{transform:translateY(-.3px)}}
@keyframes hop{0%{transform:scale(1.08,.9)}40%{transform:translateY(-2.6px) scale(.96,1.06)}100%{transform:none}}
@keyframes wig{25%{transform:rotate(-9deg)}60%{transform:rotate(7deg)}}
.hint{font-size:12px;color:var(--mut);margin:2px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0;text-align:left}
.card h2{margin:0 0 8px;font-size:16px;color:var(--acc);text-align:center}
.row{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.6}
.row:last-child{border:0}.row b{flex:0 0 76px;color:var(--mut);font-weight:600}
.wall{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wall figure{margin:0;cursor:pointer}
.wall img{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block}
.wall figcaption{font-size:12px;color:var(--mut);margin-top:4px;text-align:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;padding:16px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:78%;border-radius:10px}#lb p{color:#fff;font-size:14px;margin:12px}
.foot{font-size:12px;color:var(--mut);margin-top:22px}
</style>
